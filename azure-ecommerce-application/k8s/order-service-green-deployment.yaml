apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-green
  labels:
    app: order-service
    version: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
      version: green
  template:
    metadata:
      labels:
        app: order-service
        version: green
    spec:
      containers:
      - name: order-service
        image: acris402ecommerce.azurecr.io/order-service:v2-green
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: SERVICE_VERSION
          valueFrom:
            secretKeyRef:
              name: order-service-secrets
              key: SERVICE_VERSION
        - name: COSMOS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: order-service-secrets
              key: COSMOS_ENDPOINT
        - name: COSMOS_KEY
          valueFrom:
            secretKeyRef:
              name: order-service-secrets
              key: COSMOS_KEY
        - name: COSMOS_DATABASE
          valueFrom:
            secretKeyRef:
              name: order-service-secrets
              key: COSMOS_DATABASE
        - name: COSMOS_CONTAINER
          valueFrom:
            secretKeyRef:
              name: order-service-secrets
              key: COSMOS_CONTAINER
        - name: USER_SVC_URL
          valueFrom:
            secretKeyRef:
              name: order-service-secrets
              key: USER_SVC_URL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
