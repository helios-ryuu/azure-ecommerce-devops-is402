apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-green
  labels:
    app: order-service
    version: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
      version: green
  template:
    metadata:
      labels:
        app: order-service
        version: green
    spec:
      containers:
      - name: order-service
        image: acris402ecommerce.azurecr.io/order-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: SERVICE_VERSION
          value: "v2-green"
        - name: ORDER_STORAGE
          value: "cosmos"
        - name: COSMOS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: order-service-secrets
              key: COSMOS_ENDPOINT
        - name: COSMOS_KEY
          valueFrom:
            secretKeyRef:
              name: order-service-secrets
              key: COSMOS_KEY
        - name: COSMOS_DATABASE
          valueFrom:
            secretKeyRef:
              name: order-service-secrets
              key: COSMOS_DATABASE
        - name: COSMOS_CONTAINER
          valueFrom:
            secretKeyRef:
              name: order-service-secrets
              key: COSMOS_CONTAINER
        - name: USER_SVC_URL
          valueFrom:
            secretKeyRef:
              name: order-service-secrets
              key: USER_SVC_URL
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 400m
            memory: 384Mi
