apiVersion: v1
kind: Secret
metadata:
  name: order-service-secrets
  labels:
    app: order-service
type: Opaque
stringData:
  # Thay thế giá trị thực sau khi apply (hoặc sửa trực tiếp file này trước khi apply)
  COSMOS_ENDPOINT: "https://cosmos-is402-nosql.documents.azure.com:443/"
  COSMOS_KEY: "<THAY_PRIMARY_KEY_COSMOS_DB_TAI_DAY>"
  COSMOS_DATABASE: "ecommerce"
  COSMOS_CONTAINER: "orders"
  USER_SVC_URL: "http://user-svc:8080"
  SERVICE_VERSION: "v1-blue"
