apiVersion: v1
kind: Service
metadata:
  name: order-svc
  labels:
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
    version: blue   # Chuyển thành "green" khi muốn đổi phiên bản không downtime
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
    name: http
