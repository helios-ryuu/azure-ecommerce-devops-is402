# Copy file này thành k8s/app-secrets.secret.yaml (đã được .gitignore chặn commit)
# và điền thông tin kết nối thực tế trên Azure trước khi chạy:
#   kubectl apply -f k8s/app-secrets.secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
type: Opaque
stringData:
  DB_HOST: "pg-is402-db.postgres.database.azure.com"
  DB_PORT: "5432"
  DB_NAME: "ecommerce"
  DB_USER: "pgadmin"
  DB_PASSWORD: "<THAY_MAT_KHAU_POSTGRES_TAI_DAY>"
  DB_SSLMODE: "require"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://pg-is402-db.postgres.database.azure.com:5432/ecommerce?sslmode=require"
  SPRING_DATASOURCE_USERNAME: "pgadmin"
  SPRING_DATASOURCE_PASSWORD: "<THAY_MAT_KHAU_POSTGRES_TAI_DAY>"
  REDIS_HOST: "redis-is402-cache.redis.cache.windows.net"
  REDIS_PORT: "6380"
  REDIS_PASSWORD: "<THAY_PRIMARY_KEY_REDIS_TAI_DAY>"
  REDIS_TLS: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secrets
  labels:
    app: order-service
type: Opaque
stringData:
  COSMOS_ENDPOINT: "https://cosmos-is402-nosql.documents.azure.com:443/"
  COSMOS_KEY: "<THAY_PRIMARY_KEY_COSMOS_DB_TAI_DAY>"
  COSMOS_DATABASE: "ecommerce"
  COSMOS_CONTAINER: "orders"
  USER_SVC_URL: "http://user-svc:8080"
